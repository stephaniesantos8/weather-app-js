<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
     <h1>Weather App</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="getWeatherBtn">Search</button>
    </div>

    <div id="weatherResult" class="weather-result">
        <h2 id="cityName">Tampa</h2>
         <img id="weatherIcon" src="https://openweathermap.org/img/wn/01d.png" alt="Weather Icon">
        <p id="temperature">31°C</p>
        <p id="description">Sunny</p>
        
       
    </div>
    </div>

 <script src="script.js"></script>
</body>

</html>
